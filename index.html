<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSM Dashboard - Debug Mode</title>
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; --card: #151515; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 500px; border: 1px solid #333; box-sizing: border-box; }
        h1 { font-size: 1.2rem; text-align: center; color: var(--neon); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 3px; }
        
        #status { text-align: center; font-size: 0.8rem; padding: 10px; border-radius: 8px; background: #222; margin-bottom: 10px; color: orange; border: 1px solid #444; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #000; padding: 15px; border-radius: 12px; border: 1px dashed var(--neon); }
        .stat-box { text-align: center; }
        .stat-val { font-size: 1.1rem; color: var(--neon); font-family: monospace; font-weight: bold; }
        .section-title { font-size: 0.8rem; color: #555; margin: 20px 0 10px; border-bottom: 1px solid #222; padding-bottom: 5px; text-transform: uppercase; }
        
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #222; outline: none; -webkit-appearance: none; margin: 10px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--neon); cursor: pointer; border: 2px solid #000; }

        button { border-radius: 8px; border: 1px solid #333; padding: 12px 5px; font-size: 0.75rem; cursor: pointer; background: #222; color: #eee; width: 100%; margin: 5px 0; }
        .main-btn { padding: 15px; font-weight: bold; background: var(--neon); color: #000; border: none; font-size: 1rem; }
    </style>
</head>
<body>

<div class="card">
    <h1>OSSM DEBUG</h1>
    
    <div id="status">BAĞLANMAYA HAZIR</div>
    <button id="connectBtn" class="main-btn">CİHAZA BAĞLAN</button>

    <div class="stats-grid">
        <div class="stat-box"><div>HIZ</div><div id="liveSpeed" class="stat-val">0</div></div>
        <div class="stat-box"><div>POS</div><div id="livePos" class="stat-val">0</div></div>
    </div>

    <div class="section-title">KONTROLLER</div>
    <span>HIZ: <span id="speedVal" style="color:var(--neon)">0</span></span>
    <input type="range" id="speedSlider" min="0" max="100" value="0">
    
    <span>DERİNLİK: <span id="depthVal" style="color:var(--neon)">0</span></span>
    <input type="range" id="depthSlider" min="0" max="100" value="0">

    <div class="section-title">SİSTEM</div>
    <button onclick="sendRaw('go:homing')" style="background:#ffaa00; color:#000;">HOMING</button>
    <button onclick="sendRaw('go:strokeEngine')">ENGINE START</button>
    <button onclick="emergencyStop()" style="background:#ff3366; color:#fff;">ACİL DURDUR</button>
</div>

<script>
    let chars = {};
    const UUIDS = {
        SERVICE: "522b443a-4f53-534d-0001-420badbabe69",
        COMMAND: "522b443a-4f53-534d-0002-420badbabe69",
        STATE:   "522b443a-4f53-534d-1000-420badbabe69"
        // Patern ve Knob'u başlangıçta devre dışı bıraktım ki hata yapmasın
    };

    const statusEl = document.getElementById('status');

    document.getElementById('connectBtn').onclick = async () => {
        try {
            statusEl.innerText = "Cihaz aranıyor...";
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [UUIDS.SERVICE]
            });
            
            statusEl.innerText = "GATT Bağlantısı kuruluyor...";
            const server = await device.gatt.connect();
            
            statusEl.innerText = "Servis alınıyor...";
            const service = await server.getPrimaryService(UUIDS.SERVICE);

            statusEl.innerText = "Komut kanalı açılıyor...";
            chars.command = await service.getCharacteristic(UUIDS.COMMAND);

            statusEl.innerText = "Veri dinleme başlatılıyor...";
            chars.state = await service.getCharacteristic(UUIDS.STATE);
            await chars.state.startNotifications();
            chars.state.addEventListener('characteristicvaluechanged', (e) => {
                const data = new TextDecoder().decode(e.target.value);
                try {
                    const state = JSON.parse(data);
                    document.getElementById('liveSpeed').innerText = state.speed || 0;
                    document.getElementById('livePos').innerText = state.position || 0;
                } catch(err) {}
            });

            statusEl.innerText = "BAĞLANDI ✅";
            statusEl.style.color = "#00ffcc";
            document.getElementById('connectBtn').style.display = "none";

        } catch (e) {
            console.error(e);
            statusEl.innerText = "Hata oluştu: " + e.message;
            statusEl.style.color = "red";
        }
    };

    async function sendRaw(cmd) {
        if (!chars.command) return;
        try {
            await chars.command.writeValue(new TextEncoder().encode(cmd));
        } catch (e) { statusEl.innerText = "Gönderim Hatası!"; }
    }

    document.getElementById('speedSlider').oninput = (e) => {
        document.getElementById('speedVal').innerText = e.target.value;
        sendRaw(`set:speed:${e.target.value}`);
    };

    document.getElementById('depthSlider').oninput = (e) => {
        document.getElementById('depthVal').innerText = e.target.value;
        sendRaw(`set:depth:${e.target.value}`);
    };

    function emergencyStop() {
        sendRaw("set:speed:0");
        sendRaw("go:manual");
    }
</script>
</body>
</html>
