<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSM Pure Control</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .card { background: #151515; padding: 20px; border-radius: 20px; width: 100%; max-width: 480px; border: 1px solid #333; box-sizing: border-box; }
        h1 { font-size: 1.1rem; text-align: center; color: #00ffcc; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        .section-title { font-size: 0.8rem; color: #555; margin: 15px 0 10px; border-bottom: 1px solid #222; padding-bottom: 5px; text-transform: uppercase; }
        .control-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; }
        .val-display { color: #00ffcc; font-weight: bold; font-family: monospace; }

        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #222; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #00ffcc; cursor: pointer; border: 2px solid #000; box-shadow: 0 0 8px rgba(0,255,204,0.2); }

        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 5px; }
        button { border-radius: 8px; border: 1px solid #333; padding: 12px 5px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; background: #222; color: #eee; }
        .btn-active { background: #00ffcc !important; color: #000 !important; border-color: #00ffcc; font-weight: bold; }
        
        .main-btn { width: 100%; padding: 15px; font-weight: bold; text-transform: uppercase; margin-top: 10px; border: none; border-radius: 12px; }
        #connectBtn { background: #00ffcc; color: #000; }
        #stopBtn { background: #ff3366; color: #fff; }
        #homingBtn { background: #ffaa00; color: #000; }
        #status { text-align: center; font-size: 0.75rem; color: #444; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>OSSM CORE</h1>
    <div id="status">BAĞLANTI BEKLENİYOR</div>
    <button id="connectBtn" class="main-btn">CİHAZA BAĞLAN</button>

    <div class="section-title">HAREKET AYARLARI</div>
    <div class="control-grid">
        <div>
            <div class="label-row"><span>HIZ (Speed)</span><span id="speedVal" class="val-display">0</span></div>
            <input type="range" id="speedSlider" min="0" max="100" value="0" step="1">
        </div>
        <div>
            <div class="label-row"><span>İNME (Stroke)</span><span id="strokeVal" class="val-display">50</span></div>
            <input type="range" id="strokeSlider" min="10" max="100" value="50" step="1">
        </div>
    </div>

    <div class="section-title">DERİNLİK & HİSSİYAT</div>
    <div class="control-grid">
        <div>
            <div class="label-row"><span>DERİNLİK (Depth)</span><span id="depthVal" class="val-display">0</span></div>
            <input type="range" id="depthSlider" min="0" max="100" value="0" step="1">
        </div>
        <div>
            <div class="label-row"><span>YUMUŞAKLIK (Sensation)</span><span id="sensVal" class="val-display">50</span></div>
            <input type="range" id="sensSlider" min="0" max="100" value="50" step="1">
        </div>
    </div>

    <div class="section-title">PATERN (set:pattern)</div>
    <div class="btn-group">
        <button class="p-btn btn-active" onclick="sendCmd('set:pattern:0', this)">DÜZ</button>
        <button class="p-btn" onclick="sendCmd('set:pattern:1', this)">P1</button>
        <button class="p-btn" onclick="sendCmd('set:pattern:2', this)">P2</button>
        <button class="p-btn" onclick="sendCmd('set:pattern:3', this)">P3</button>
        <button class="p-btn" onclick="sendCmd('set:pattern:4', this)">P4</button>
        <button class="p-btn" onclick="sendCmd('set:pattern:5', this)">P5</button>
        <button class="p-btn" onclick="sendCmd('set:pattern:6', this)">P6</button>
    </div>

    <div class="section-title">SİSTEM KOMUTLARI</div>
    <div style="display: flex; gap: 8px;">
        <button id="homingBtn" style="flex: 1;" onclick="sendCmd('go:homing')">HOMING (SIFIRLA)</button>
        <button style="flex: 1; background: #333;" onclick="sendCmd('go:strokeEngine')">MOTORU AÇ (RESUME)</button>
    </div>
    
    <button id="stopBtn" class="main-btn" onclick="emergencyStop()">ACİL DURDUR</button>
</div>

<script>
    let ossmChar = null;
    const SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69"; 
    const CHAR_UUID    = "522b443a-4f53-534d-1000-420badbabe69";

    const connectBtn = document.getElementById('connectBtn');
    const statusEl = document.getElementById('status');

    connectBtn.onclick = async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            ossmChar = await service.getCharacteristic(CHAR_UUID);
            
            statusEl.innerText = "BAĞLANDI ✅";
            statusEl.style.color = "#00ffcc";
            connectBtn.style.display = "none";

            // Başlangıç durumu
            sendCmd("go:manual");
        } catch (e) { statusEl.innerText = "Hata: " + e.message; }
    };

    async function sendCmd(cmd, btn = null) {
        if (!ossmChar) return;
        try {
            await ossmChar.writeValue(new TextEncoder().encode(cmd));
            console.log(">>", cmd);
            
            if (btn && btn.classList.contains('p-btn')) {
                document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('btn-active'));
                btn.classList.add('btn-active');
            }
        } catch (err) { console.error("BLE Error:", err); }
    }

    function setupSlider(id, valId, prefix) {
        const s = document.getElementById(id);
        const v = document.getElementById(valId);
        s.oninput = () => {
            v.innerText = s.value;
            sendCmd(`${prefix}:${s.value}`);
        };
    }

    // Adımları 1'e çektim (Dökümandaki 0-100 tam hassasiyet için)
    setupSlider('speedSlider', 'speedVal', 'set:speed');
    setupSlider('strokeSlider', 'strokeVal', 'set:stroke');
    setupSlider('depthSlider', 'depthVal', 'set:depth');
    setupSlider('sensSlider', 'sensVal', 'set:sensation');

    function emergencyStop() {
        document.getElementById('speedSlider').value = 0;
        document.getElementById('speedVal').innerText = "0";
        sendCmd("set:speed:0");
        sendCmd("go:manual");
    }
</script>
</body>
</html>
