<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSM Ultimate Dashboard</title>
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; --card: #151515; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; width: 100%; max-width: 500px; border: 1px solid #333; box-shadow: 0 20px 50px rgba(0,0,0,0.5); box-sizing: border-box; }
        h1 { font-size: 1.2rem; text-align: center; color: var(--neon); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 3px; }
        
        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #000; padding: 15px; border-radius: 12px; border: 1px dashed var(--neon); }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.7rem; color: #666; text-transform: uppercase; }
        .stat-val { font-size: 1.1rem; color: var(--neon); font-family: monospace; font-weight: bold; }

        .section-title { font-size: 0.8rem; color: #555; margin: 20px 0 10px; border-bottom: 1px solid #222; padding-bottom: 5px; text-transform: uppercase; }
        .control-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        /* Sliders */
        .slider-row { margin-bottom: 15px; }
        .label-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #222; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--neon); cursor: pointer; border: 2px solid #000; }

        /* Buttons */
        .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        button { border-radius: 8px; border: 1px solid #333; padding: 12px 5px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; background: #222; color: #eee; }
        .btn-active { background: var(--neon) !important; color: #000 !important; font-weight: bold; }
        
        .main-btn { width: 100%; padding: 15px; font-weight: bold; text-transform: uppercase; margin-top: 10px; border: none; border-radius: 12px; cursor: pointer; }
        #connectBtn { background: var(--neon); color: #000; }
        #stopBtn { background: #ff3366; color: #fff; margin-top: 20px; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; background: #222; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h1>OSSM DASHBOARD</h1>
    
    <div id="status" style="text-align:center; font-size:0.7rem; color:#444; margin-bottom:10px;">BAĞLANTI BEKLENİYOR...</div>
    <button id="connectBtn" class="main-btn">CİHAZA BAĞLAN</button>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">HIZ (Realtime)</div>
            <div id="liveSpeed" class="stat-val">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">KONUM (Pos)</div>
            <div id="livePos" class="stat-val">0</div>
        </div>
    </div>

    <div class="section-title">ANA HAREKET</div>
    <div class="control-grid">
        <div class="slider-row">
            <div class="label-row"><span>HIZ (Speed)</span><span id="speedVal" class="stat-val">0</span></div>
            <input type="range" id="speedSlider" min="0" max="100" value="0">
        </div>
        <div class="slider-row">
            <div class="label-row"><span>DERİNLİK (Depth)</span><span id="depthVal" class="stat-val">0</span></div>
            <input type="range" id="depthSlider" min="0" max="100" value="0">
        </div>
    </div>

    <div class="section-title">HASSAS AYARLAR</div>
    <div class="control-grid">
        <div class="slider-row">
            <div class="label-row"><span>İNME (Stroke)</span><span id="strokeVal" class="stat-val">50</span></div>
            <input type="range" id="strokeSlider" min="10" max="100" value="50">
        </div>
        <div class="slider-row">
            <div class="label-row"><span>YUMUŞAKLIK (Sensation)</span><span id="sensVal" class="stat-val">50</span></div>
            <input type="range" id="sensSlider" min="0" max="100" value="50">
        </div>
    </div>

    <div class="section-title">GÜVENLİK</div>
    <div class="toggle-row">
        <span style="font-size: 0.8rem;">Fiziksel Düğmeyi Limit Yap (Knob)</span>
        <input type="checkbox" id="knobToggle" onchange="toggleKnob()">
    </div>

    <div class="section-title">DİNAMİK PATERNLER</div>
    <div id="patternGrid" class="btn-group">
        <span style="font-size: 0.7rem; color: #555;">Cihazdan liste bekleniyor...</span>
    </div>

    <div class="section-title">SİSTEM</div>
    <div style="display: flex; gap: 8px;">
        <button onclick="sendRaw('go:homing')" style="flex:1; background:#ffaa00; color:#000;">HOMING</button>
        <button onclick="sendRaw('go:strokeEngine')" style="flex:1; background:#333;">ENGINE START</button>
    </div>
    
    <button id="stopBtn" class="main-btn" onclick="emergencyStop()">ACİL DURDUR</button>
</div>

<script>
    let chars = {};
    const UUIDS = {
        SERVICE: "522b443a-4f53-534d-0001-420badbabe69",
        COMMAND: "522b443a-4f53-534d-0002-420badbabe69",
        STATE:   "522b443a-4f53-534d-1000-420badbabe69",
        KNOB:    "522b443a-4f53-534d-0010-420badbabe69",
        PATTERNS:"522b443a-4f53-534d-2000-420badbabe69"
    };

    document.getElementById('connectBtn').onclick = async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [UUIDS.SERVICE]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(UUIDS.SERVICE);

            chars.command = await service.getCharacteristic(UUIDS.COMMAND);
            chars.state   = await service.getCharacteristic(UUIDS.STATE);
            chars.knob    = await service.getCharacteristic(UUIDS.KNOB);
            chars.patterns= await service.getCharacteristic(UUIDS.PATTERNS);

            await chars.state.startNotifications();
            chars.state.addEventListener('characteristicvaluechanged', handleStateUpdate);

            loadPatterns();

            document.getElementById('status').innerText = "BAĞLANDI ✅";
            document.getElementById('connectBtn').style.display = "none";
        } catch (e) { console.log(e); }
    };

    function handleStateUpdate(event) {
        const data = new TextDecoder().decode(event.target.value);
        try {
            const state = JSON.parse(data);
            if(state.speed !== undefined) document.getElementById('liveSpeed').innerText = state.speed;
            if(state.position !== undefined) document.getElementById('livePos').innerText = state.position;
        } catch(e) {}
    }

    async function loadPatterns() {
        try {
            const val = await chars.patterns.readValue();
            const patternList = JSON.parse(new TextDecoder().decode(val));
            const grid = document.getElementById('patternGrid');
            grid.innerHTML = "";
            
            patternList.forEach((p, index) => {
                const btn = document.createElement('button');
                btn.innerText = p;
                btn.onclick = () => {
                    sendRaw(`set:pattern:${index}`);
                    document.querySelectorAll('#patternGrid button').forEach(b => b.classList.remove('btn-active'));
                    btn.classList.add('btn-active');
                };
                grid.appendChild(btn);
            });
        } catch(e) { console.log("Pattern error", e); }
    }

    async function toggleKnob() {
        const isEnabled = document.getElementById('knobToggle').checked;
        const msg = isEnabled ? "true" : "false";
        if(chars.knob) await chars.knob.writeValue(new TextEncoder().encode(msg));
    }

    async function sendRaw(cmd) {
        if (chars.command) {
            await chars.command.writeValue(new TextEncoder().encode(cmd));
            console.log("Sent:", cmd);
        }
    }

    function setupSlider(id, valId, prefix) {
        const s = document.getElementById(id);
        const v = document.getElementById(valId);
        s.oninput = () => {
            v.innerText = s.value;
            sendRaw(`${prefix}:${s.value}`);
        };
    }

    setupSlider('speedSlider', 'speedVal', 'set:speed');
    setupSlider('depthSlider', 'depthVal', 'set:depth');
    setupSlider('strokeSlider', 'strokeVal', 'set:stroke');
    setupSlider('sensSlider', 'sensVal', 'set:sensation');

    function emergencyStop() {
        sendRaw("set:speed:0");
        sendRaw("go:manual");
        document.getElementById('speedSlider').value = 0;
        document.getElementById('speedVal').innerText = "0";
    }
</script>
</body>
</html>
