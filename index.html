<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OSSM Pro - Dynamic Patterns</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; padding: 15px; margin: 0; }
        .card { background: #161616; padding: 20px; border-radius: 20px; border: 1px solid #333; max-width: 450px; margin: 10px auto; }
        h2 { color: var(--neon); text-transform: uppercase; font-size: 1.1rem; letter-spacing: 2px; }
        .btn { background: var(--neon); color: black; padding: 15px; border-radius: 12px; border: none; font-weight: bold; width: 100%; cursor: pointer; margin: 5px 0; }
        .btn-stop { background: #ff3366; color: white; margin-top: 15px; }
        
        /* Dinamik Patern Izgarası */
        #patternContainer { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        .p-btn { background: #222; color: #ccc; padding: 12px; border-radius: 8px; border: 1px solid #444; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .p-btn:hover { border-color: var(--neon); }
        .active-p { background: var(--neon) !important; color: black !important; font-weight: bold; }

        .slider-box { background: #222; padding: 12px; border-radius: 12px; margin: 12px 0; border: 1px solid #2a2a2a; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
        .val { color: var(--neon); font-family: monospace; }
        input[type=range] { width: 100%; height: 8px; accent-color: var(--neon); cursor: pointer; }
        .section-title { font-size: 0.7rem; color: #666; text-transform: uppercase; margin-top: 20px; border-bottom: 1px solid #222; padding-bottom: 5px; text-align: left; }
    </style>
</head>
<body>

<div class="card">
    <h2>OSSM COMMANDER</h2>
    <button id="connectBtn" class="btn">CİHAZA BAĞLAN</button>
    
    <div id="controls" style="display:none;">
        <button onclick="send('go:strokeEngine')" class="btn" style="background:#ffaa00">ENGINE START</button>

        <div class="section-title">Hız ve Derinlik</div>
        <div class="slider-box">
            <div class="label-row"><span>HIZ</span><span id="v1" class="val">0</span></div>
            <input type="range" id="s1" min="0" max="100" value="0">
        </div>
        <div class="slider-box">
            <div class="label-row"><span>DERİNLİK</span><span id="v2" class="val">50</span></div>
            <input type="range" id="s2" min="0" max="100" value="50">
        </div>

        <div class="section-title">Cihazdaki Paternler</div>
        <div id="patternContainer">
            <small style="color:#444">Yükleniyor...</small>
        </div>

        <div class="section-title">Gelişmiş Ayarlar</div>
        <div class="slider-box">
            <div class="label-row"><span>STROKE</span><span id="v3" class="val">50</span></div>
            <input type="range" id="s3" min="10" max="100" value="50">
        </div>
        <div class="slider-box">
            <div class="label-row"><span>SENSATION</span><span id="v4" class="val">50</span></div>
            <input type="range" id="s4" min="0" max="100" value="50">
        </div>

        <button onclick="stop()" class="btn btn-stop">STOP</button>
    </div>
</div>

<script>
    let ossmChar = null;
    let patternChar = null;
    const SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69";
    const COMMAND_CHAR = "522b443a-4f53-534d-1000-420badbabe69";
    const PATTERN_LIST_CHAR = "522b443a-4f53-534d-2000-420badbabe69"; // Patern listesini tutan kanal

    document.getElementById('connectBtn').onclick = async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            
            ossmChar = await service.getCharacteristic(COMMAND_CHAR);
            
            // Patern listesini almayı dene
            try {
                patternChar = await service.getCharacteristic(PATTERN_LIST_CHAR);
                const value = await patternChar.readValue();
                const decoder = new TextDecoder();
                const patterns = JSON.parse(decoder.decode(value));
                displayPatterns(patterns);
            } catch (pErr) {
                console.error("Patern listesi alınamadı", pErr);
                document.getElementById('patternContainer').innerHTML = "<small>Paternler yüklenemedi.</small>";
            }

            document.getElementById('controls').style.display = "block";
            document.getElementById('connectBtn').style.display = "none";
        } catch (e) { alert("Hata: " + e.message); }
    };

    function displayPatterns(patterns) {
        const container = document.getElementById('patternContainer');
        container.innerHTML = ""; // Temizle
        patterns.forEach((name, index) => {
            const btn = document.createElement('button');
            btn.className = 'p-btn';
            btn.innerText = name.toUpperCase();
            btn.onclick = () => {
                document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
                btn.classList.add('active-p');
                send(`set:pattern:${index}`);
            };
            container.appendChild(btn);
        });
    }

    async function send(cmd) {
        if (!ossmChar) return;
        await ossmChar.writeValue(new TextEncoder().encode(cmd));
    }

    function setup(id, valId, cmd) {
        const s = document.getElementById(id);
        const v = document.getElementById(valId);
        s.oninput = () => {
            v.innerText = s.value;
            send(cmd + ":" + s.value);
        };
    }

    setup('s1', 'v1', 'set:speed');
    setup('s2', 'v2', 'set:depth');
    setup('s3', 'v3', 'set:stroke');
    setup('s4', 'v4', 'set:sensation');

    function stop() {
        send("set:speed:0");
        send("go:manual");
    }
</script>
</body>
</html>
