<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OSSM Simple Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #111; color: white; text-align: center; padding: 20px; }
        .btn { background: #00ffcc; color: black; padding: 20px; border-radius: 10px; border: none; font-weight: bold; width: 100%; font-size: 1.2rem; }
        .slider-box { margin: 30px 0; background: #222; padding: 15px; border-radius: 10px; }
        input[type=range] { width: 100%; height: 15px; }
        .stop { background: #ff3366; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>OSSM CONTROL</h1>
    <button id="connectBtn" class="btn">BAĞLAN</button>
    <div id="status" style="margin: 10px; color: #888;">Cihaz bekleniyor...</div>

    <div id="controls" style="display:none;">
        <div class="slider-box">
            HIZ: <span id="v1">0</span>
            <input type="range" id="s1" min="0" max="100" value="0">
        </div>

        <div class="slider-box">
            DERİNLİK: <span id="v2">0</span>
            <input type="range" id="s2" min="0" max="100" value="0">
        </div>

        <div class="slider-box">
            İNME (Stroke): <span id="v3">50</span>
            <input type="range" id="s3" min="10" max="100" value="50">
        </div>

        <div class="slider-box">
            YUMUŞAKLIK (Sens): <span id="v4">50</span>
            <input type="range" id="s4" min="0" max="100" value="50">
        </div>

        <button onclick="send('go:homing')" style="background:#444; color:white; padding:10px; width:100%; border-radius:5px; margin-bottom:5px;">SIFIRLA (HOMING)</button>
        <button onclick="send('go:strokeEngine')" style="background:#444; color:white; padding:10px; width:100%; border-radius:5px;">BAŞLAT (START)</button>
        <button onclick="stop()" class="btn stop">DURDUR (STOP)</button>
    </div>

<script>
    let ossmChar = null;
    const SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69";
    const CHAR_UUID = "522b443a-4f53-534d-1000-420badbabe69"; // nRF'de gördüğümüz çalışan kanal

    document.getElementById('connectBtn').onclick = async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            ossmChar = await service.getCharacteristic(CHAR_UUID);

            document.getElementById('status').innerText = "BAĞLANDI ✅";
            document.getElementById('controls').style.display = "block";
            document.getElementById('connectBtn').style.display = "none";
        } catch (e) {
            alert("Bağlantı Hatası: " + e.message);
        }
    };

    async function send(cmd) {
        if (!ossmChar) return;
        await ossmChar.writeValue(new TextEncoder().encode(cmd));
    }

    function setup(id, valId, cmd) {
        const s = document.getElementById(id);
        const v = document.getElementById(valId);
        s.oninput = () => {
            v.innerText = s.value;
            send(cmd + ":" + s.value);
        };
    }

    setup('s1', 'v1', 'set:speed');
    setup('s2', 'v2', 'set:depth');
    setup('s3', 'v3', 'set:stroke');
    setup('s4', 'v4', 'set:sensation');

    function stop() {
        send("set:speed:0");
        send("go:manual");
        document.getElementById('s1').value = 0;
        document.getElementById('v1').innerText = "0";
    }
</script>
</body>
</html>
