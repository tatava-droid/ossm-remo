<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OSSM Ultimate Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; text-align: center; padding: 20px; margin: 0; }
        .card { background: #161616; padding: 25px; border-radius: 20px; border: 1px solid #333; max-width: 420px; margin: 20px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #00ffcc; text-transform: uppercase; letter-spacing: 2px; font-size: 1.2rem; margin-bottom: 25px; }
        .btn { background: #00ffcc; color: black; padding: 18px; border-radius: 12px; border: none; font-weight: bold; width: 100%; margin: 10px 0; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        .slider-box { margin: 25px 0; background: #222; padding: 15px; border-radius: 12px; border: 1px solid #2a2a2a; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; font-weight: bold; }
        .val { color: #00ffcc; font-family: monospace; }
        input[type=range] { width: 100%; height: 10px; border-radius: 5px; background: #333; outline: none; -webkit-appearance: none; accent-color: #00ffcc; }
        .stop { background: #ff3366; color: white; margin-top: 30px; }
        .start { background: #ffaa00; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>OSSM CORE CONTROL</h2>
    
    <button id="connectBtn" class="btn">CİHAZA BAĞLAN</button>
    
    <div id="controls" style="display:none;">
        <button onclick="send('go:strokeEngine')" class="btn start">MOTORU AKTİF ET (START)</button>

        <div class="slider-box">
            <div class="label-row"><span>HIZ (Speed)</span><span id="v1" class="val">0</span></div>
            <input type="range" id="s1" min="0" max="100" value="0">
        </div>

        <div class="slider-box">
            <div class="label-row"><span>VURUŞ BOYU (Stroke)</span><span id="v3" class="val">50</span></div>
            <input type="range" id="s3" min="0" max="100" value="50">
        </div>

        <div class="slider-box">
            <div class="label-row"><span>ORTALAMA KONUM (Depth)</span><span id="v2" class="val">50</span></div>
            <input type="range" id="s2" min="0" max="100" value="50">
        </div>

        <div class="slider-box">
            <div class="label-row"><span>YUMUŞAKLIK (Sensation)</span><span id="v4" class="val">50</span></div>
            <input type="range" id="s4" min="0" max="100" value="50">
        </div>

        <button onclick="stop()" class="btn stop">DURDUR (STOP)</button>
    </div>
</div>

<script>
    let ossmChar = null;
    const SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69";
    const CHAR_UUID = "522b443a-4f53-534d-1000-420badbabe69";

    document.getElementById('connectBtn').onclick = async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            ossmChar = await service.getCharacteristic(CHAR_UUID);
            
            document.getElementById('controls').style.display = "block";
            document.getElementById('connectBtn').style.display = "none";
        } catch (e) { alert("Hata: " + e.message); }
    };

    async function send(cmd) {
        if (!ossmChar) return;
        try {
            await ossmChar.writeValue(new TextEncoder().encode(cmd));
            console.log("Sent:", cmd);
        } catch (e) { console.error("Send Error:", e); }
    }

    function setup(id, valId, cmd) {
        const s = document.getElementById(id);
        const v = document.getElementById(valId);
        s.oninput = () => {
            v.innerText = s.value;
            send(cmd + ":" + s.value);
        };
    }

    // Sliderları Tanımla
    setup('s1', 'v1', 'set:speed');
    setup('s2', 'v2', 'set:depth');
    setup('s3', 'v3', 'set:stroke');
    setup('s4', 'v4', 'set:sensation');

    function stop() {
        send("set:speed:0");
        send("go:manual");
    }
</script>
</body>
</html>
