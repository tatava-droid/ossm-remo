<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSM - 1000 Channel</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #00ffcc; text-align: center; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 15px; border: 1px solid #333; max-width: 400px; margin: auto; }
        #status { font-size: 0.8rem; color: #888; margin: 15px 0; min-height: 40px; }
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #333; color: white; }
        .conn-btn { background: #00ffcc; color: #000; font-size: 1rem; }
        .stop-btn { background: #ff3366; }
        input[type=range] { width: 100%; margin: 20px 0; accent-color: #00ffcc; }
    </style>
</head>
<body>

<div class="card">
    <h2>OSSM CORE (1000)</h2>
    <div id="status">Bluetooth bekleniyor...</div>
    <button id="connectBtn" class="conn-btn">CİHAZ TARAMASINI BAŞLAT</button>

    <div id="controls" style="display:none;">
        <p>HIZ: <span id="sVal">0</span></p>
        <input type="range" id="sSlider" min="0" max="100" value="0">
        
        <p>DERİNLİK: <span id="dVal">0</span></p>
        <input type="range" id="dSlider" min="0" max="100" value="0">

        <button onclick="send('go:strokeEngine')">MOTORU AÇ (ENGINE)</button>
        <button onclick="send('go:homing')">SIFIRLA (HOMING)</button>
        <button onclick="emergencyStop()" class="stop-btn">ACİL DURDUR</button>
    </div>
</div>

<script>
    let mainChar = null;
    const SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69";
    const CHAR_UUID    = "522b443a-4f53-534d-1000-420badbabe69"; // Konuştuğumuz 1000 kanalı

    const statusEl = document.getElementById('status');

    document.getElementById('connectBtn').onclick = async () => {
        try {
            statusEl.innerText = "Bağlanıyor...";
            
            // Filtreyi gevşettik: Tüm cihazları gösterir
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true, 
                optionalServices: [SERVICE_UUID]
            });

            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            mainChar = await service.getCharacteristic(CHAR_UUID);

            // Veri bildirimlerini (Notify) dinle
            try {
                await mainChar.startNotifications();
                mainChar.addEventListener('characteristicvaluechanged', (e) => {
                    console.log("Cihazdan gelen:", new TextDecoder().decode(e.target.value));
                });
            } catch(nErr) { console.log("Bildirim desteği yok."); }

            statusEl.innerText = "BAĞLANDI: " + device.name;
            statusEl.style.color = "#00ffcc";
            document.getElementById('controls').style.display = "block";
            document.getElementById('connectBtn').style.display = "none";

        } catch (e) {
            statusEl.innerText = "Hata: " + e.message;
            console.error(e);
        }
    };

    async function send(cmd) {
        if (!mainChar) return;
        try {
            await mainChar.writeValue(new TextEncoder().encode(cmd));
        } catch (e) { statusEl.innerText = "Gönderilemedi!"; }
    }

    document.getElementById('sSlider').oninput = (e) => {
        document.getElementById('sVal').innerText = e.target.value;
        send(`set:speed:${e.target.value}`);
    };

    document.getElementById('dSlider').oninput = (e) => {
        document.getElementById('dVal').innerText = e.target.value;
        send(`set:depth:${e.target.value}`);
    };

    function emergencyStop() {
        send("set:speed:0");
        send("go:manual");
    }
</script>
</body>
</html>
