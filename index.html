<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OSSM Pro - Solid Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; }
        body { font-family: sans-serif; background: var(--bg); color: white; text-align: center; padding: 15px; }
        .card { background: #161616; padding: 20px; border-radius: 20px; border: 1px solid #333; max-width: 400px; margin: auto; }
        .btn { background: var(--neon); color: black; padding: 15px; border-radius: 12px; border: none; font-weight: bold; width: 100%; cursor: pointer; }
        .section-title { font-size: 0.7rem; color: #666; text-transform: uppercase; margin: 15px 0 5px; text-align: left; border-bottom: 1px solid #222; }
        
        /* Patern Butonları */
        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .p-btn { background: #222; color: white; border: 1px solid #444; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .active-p { background: var(--neon) !important; color: black !important; font-weight: bold; }

        .slider-box { background: #222; padding: 10px; border-radius: 10px; margin: 10px 0; }
        .label-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
        input[type=range] { width: 100%; accent-color: var(--neon); }
        .stop { background: #ff3366; color: white; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color:var(--neon)">OSSM CONTROL</h2>
    <button id="connectBtn" class="btn">CİHAZA BAĞLAN</button>
    
    <div id="controls" style="display:none;">
        <button onclick="send('go:strokeEngine')" class="btn" style="background:#ffaa00; margin-bottom:10px;">ENGINE START</button>

        <div class="section-title">HAZIR PATERNLER</div>
        <div class="p-grid">
            <button class="p-btn active-p" id="p0" onclick="changePattern(0)">MANUEL (Constant)</button>
            <button class="p-btn" id="p1" onclick="changePattern(1)">SINE (Luna)</button>
            <button class="p-btn" id="p2" onclick="changePattern(2)">SAW (Pulse)</button>
            <button class="p-btn" id="p3" onclick="changePattern(3)">TRIANGLE</button>
            <button class="p-btn" id="p4" onclick="changePattern(4)">SQUARE</button>
            <button class="p-btn" id="p5" onclick="changePattern(5)">RANDOM</button>
        </div>

        <div class="section-title">ANA AYARLAR</div>
        <div class="slider-box">
            <div class="label-row"><span>HIZ</span><span id="v1">0</span></div>
            <input type="range" id="s1" min="0" max="100" value="0">
        </div>
        <div class="slider-box">
            <div class="label-row"><span>DERİNLİK</span><span id="v2">50</span></div>
            <input type="range" id="s2" min="0" max="100" value="50">
        </div>
        <div class="slider-box">
            <div class="label-row"><span>STROKE</span><span id="v3">50</span></div>
            <input type="range" id="s3" min="10" max="100" value="50">
        </div>

        <button onclick="stop()" class="btn stop">DURDUR (STOP)</button>
    </div>
</div>

<script>
    let ossmChar = null;
    const SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69";
    const CHAR_UUID = "522b443a-4f53-534d-1000-420badbabe69";

    document.getElementById('connectBtn').onclick = async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            ossmChar = await service.getCharacteristic(CHAR_UUID);
            document.getElementById('controls').style.display = "block";
            document.getElementById('connectBtn').style.display = "none";
        } catch (e) { alert("Bağlantı Hatası: " + e.message); }
    };

    async function send(cmd) {
        if (!ossmChar) return;
        try {
            await ossmChar.writeValue(new TextEncoder().encode(cmd));
            console.log("Gönderildi:", cmd);
        } catch (e) { console.error("Hata:", e); }
    }

    function changePattern(idx) {
        // Buton renklerini güncelle
        document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
        document.getElementById('p' + idx).classList.add('active-p');
        
        // Önce hızı ve stroku tazele (paternlerin çalışması için)
        send(`set:pattern:${idx}`);
    }

    function setup(id, valId, cmd) {
        const s = document.getElementById(id);
        const v = document.getElementById(valId);
        s.oninput = () => {
            v.innerText = s.value;
            send(cmd + ":" + s.value);
        };
    }

    setup('s1', 'v1', 'set:speed');
    setup('s2', 'v2', 'set:depth');
    setup('s3', 'v3', 'set:stroke');

    function stop() {
        send("set:speed:0");
        send("go:manual");
    }
</script>
</body>
</html>
