<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OSSM Pro - Official Patterns</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; padding: 15px; margin: 0; }
        .card { background: #161616; padding: 20px; border-radius: 20px; border: 1px solid #333; max-width: 480px; margin: 10px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--neon); text-transform: uppercase; font-size: 1.1rem; letter-spacing: 2px; margin-bottom: 20px; }
        
        .btn { background: var(--neon); color: black; padding: 15px; border-radius: 12px; border: none; font-weight: bold; width: 100%; cursor: pointer; margin: 5px 0; font-size: 1rem; }
        .btn-stop { background: #ff3366; color: white; margin-top: 15px; }
        
        /* Patern Listesi */
        .p-list { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
        .p-btn { background: #222; color: #eee; padding: 12px; border-radius: 10px; border: 1px solid #444; font-size: 0.85rem; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .p-btn span { color: #666; font-size: 0.7rem; }
        .p-btn:hover { border-color: var(--neon); }
        .active-p { background: var(--neon) !important; color: black !important; border-color: var(--neon); font-weight: bold; }
        .active-p span { color: rgba(0,0,0,0.5); }

        .slider-box { background: #222; padding: 12px; border-radius: 12px; margin: 10px 0; border: 1px solid #2a2a2a; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.8rem; font-weight: bold; }
        .val { color: var(--neon); font-family: monospace; }
        input[type=range] { width: 100%; height: 8px; accent-color: var(--neon); cursor: pointer; }
        .section-title { font-size: 0.7rem; color: #666; text-transform: uppercase; margin-top: 20px; border-bottom: 1px solid #222; padding-bottom: 5px; text-align: left; }
    </style>
</head>
<body>

<div class="card">
    <h2>OSSM COMMANDER</h2>
    <button id="connectBtn" class="btn">CİHAZA BAĞLAN</button>
    
    <div id="controls" style="display:none;">
        <button onclick="send('go:strokeEngine')" class="btn" style="background:#ffaa00">ENGINE START</button>

        <div class="section-title">Motion Patterns</div>
        <div class="p-list">
            <button class="p-btn active-p" id="p0" onclick="changePattern(0)">Simple Stroke <span>(0)</span></button>
            <button class="p-btn" id="p1" onclick="changePattern(1)">Teasing Pounding <span>(1)</span></button>
            <button class="p-btn" id="p2" onclick="changePattern(2)">Robo Stroke <span>(2)</span></button>
            <button class="p-btn" id="p3" onclick="changePattern(3)">Half'n'Half <span>(3)</span></button>
            <button class="p-btn" id="p4" onclick="changePattern(4)">Deeper <span>(4)</span></button>
            <button class="p-btn" id="p5" onclick="changePattern(5)">Stop'n'Go <span>(5)</span></button>
            <button class="p-btn" id="p6" onclick="changePattern(6)">Insist <span>(6)</span></button>
        </div>

        <div class="section-title">Live Controls</div>
        <div class="slider-box">
            <div class="label-row"><span>SPEED</span><span id="v1" class="val">0</span></div>
            <input type="range" id="s1" min="0" max="100" value="0">
        </div>
        <div class="slider-box">
            <div class="label-row"><span>STROKE</span><span id="v3" class="val">50</span></div>
            <input type="range" id="s3" min="10" max="100" value="50">
        </div>
        <div class="slider-box">
            <div class="label-row"><span>DEPTH</span><span id="v2" class="val">50</span></div>
            <input type="range" id="s2" min="0" max="100" value="50">
        </div>
        <div class="slider-box">
            <div class="label-row"><span>SENSATION</span><span id="v4" class="val">50</span></div>
            <input type="range" id="s4" min="0" max="100" value="50">
        </div>

        <button onclick="stop()" class="btn btn-stop">EMERGENCY STOP</button>
    </div>
</div>

<script>
    let ossmChar = null;
    const SERVICE_UUID = "522b443a-4f53-534d-0001-420badbabe69";
    const CHAR_UUID = "522b443a-4f53-534d-1000-420badbabe69";

    document.getElementById('connectBtn').onclick = async () => {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'OSSM' }],
                optionalServices: [SERVICE_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            ossmChar = await service.getCharacteristic(CHAR_UUID);
            document.getElementById('controls').style.display = "block";
            document.getElementById('connectBtn').style.display = "none";
        } catch (e) { alert("Bağlantı Hatası: " + e.message); }
    };

    async function send(cmd) {
        if (!ossmChar) return;
        try {
            await ossmChar.writeValue(new TextEncoder().encode(cmd));
        } catch (e) { console.error("BLE Error:", e); }
    }

    function changePattern(idx) {
        document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
        document.getElementById('p' + idx).classList.add('active-p');
        send(`set:pattern:${idx}`);
    }

    function setup(id, valId, cmd) {
        const s = document.getElementById(id);
        const v = document.getElementById(valId);
        s.oninput = () => {
            v.innerText = s.value;
            send(cmd + ":" + s.value);
        };
    }

    setup('s1', 'v1', 'set:speed');
    setup('s2', 'v2', 'set:depth');
    setup('s3', 'v3', 'set:stroke');
    setup('s4', 'v4', 'set:sensation');

    function stop() {
        send("set:speed:0");
        send("go:manual");
        document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active-p'));
        document.getElementById('p0').classList.add('active-p');
    }
</script>
</body>
</html>
